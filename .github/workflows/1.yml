name: Process Previous Workflow Logs

on:
  workflow_dispatch: # Can be triggered manually or via push/schedule

jobs:
  process-logs:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Previous Run Logs & Convert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os
          import requests
          import zipfile
          io = __import__('io')

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          # 1. Get the list of workflow runs to find the previous run ID
          runs_url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=2"
          response = requests.get(runs_url, headers=headers)
          response.raise_for_status()
          runs = response.json().get("workflow_runs", [])

          if len(runs) < 2:
              print("No previous workflow run found (this might be the first run).")
              exit(0)

          # Index 0 is usually the current run, Index 1 is the previous run
          prev_run_id = runs[1]["id"]
          print(f"Targeting previous run ID: {prev_run_id}")

          # 2. Download the logs zip archive for that run
          logs_url = f"https://api.github.com/repos/{repo}/actions/runs/{prev_run_id}/logs"
          logs_response = requests.get(logs_url, headers=headers, allow_redirects=True)
          
          if logs_response.status_code != 200:
              print(f"Failed to fetch logs: {logs_response.status_code}")
              exit(1)

          # Extract zip contents into a temporary directory
          os.makedirs("extracted_logs", exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(logs_response.content)) as z:
              z.extractall("extracted_logs")
          
          print("Logs successfully downloaded and extracted to ./extracted_logs")
          EOF

      - name: Run log_to_json.py Script
        run: |
          # Pass your extracted logs directory to your script
          python tools/log_to_json.py --input extracted_logs --output output.json

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-workflow-logs-json
          path: output.json
