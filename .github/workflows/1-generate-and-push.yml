name: 1. Generate Project From Docs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**Shelf**.zip'   # fires when a doc zip whose name contains "Shelf" changes

permissions:
  contents: write

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT, not the default GITHUB_TOKEN -- required so the commit this job makes later
          # actually triggers "2. Compile, Repair, Verify, and Learn" via its own push trigger.
          token: ${{ secrets.REPO_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle
          pip install --upgrade kaggle   
          kaggle --version
          pip install --force-reinstall --no-cache-dir "kaggle>=1.8.4"     
          kaggle --version

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      # CHANGED: Kaggle has no API to grant a kernel access to Kaggle Secrets programmatically --
      # that's a manual, per-kernel toggle in the Kaggle UI (Add-ons -> Secrets). That's exactly
      # why the automated "Save & Run All" push was failing with "NGROK_AUTH_TOKEN not found in
      # Kaggle Secrets" -- this workflow creates a brand-new kernel push every run, and Kaggle
      # Secrets access was never (and can't be) granted to it automatically.
      #
      # Kaggle DOES have an API for datasets, though, and datasets attach to a kernel
      # automatically via dataset_sources in kernel-metadata.json -- so the fix is to smuggle the
      # secrets in as a small private dataset instead. This directory is generated fresh on every
      # run and is NEVER committed to git (see .gitignore) -- only the resulting private Kaggle
      # dataset (visible solely to your own Kaggle account) holds the actual values.
      - name: Build the Kaggle secrets-bridge dataset
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p secrets_bridge
          python3 - <<'PYEOF'
          import json, os
          secrets = {
              "NGROK_AUTH_TOKEN": os.environ.get("NGROK_AUTH_TOKEN", ""),
              "API_KEY": os.environ.get("API_KEY", ""),
              # Optional -- silences "unauthenticated requests to the HF Hub" warnings and raises
              # rate limits. Leave the HF_TOKEN repo secret unset and this is just an empty string.
              "HF_TOKEN": os.environ.get("HF_TOKEN", ""),
          }
          missing = [k for k, v in secrets.items() if not v and k != "HF_TOKEN"]
          if missing:
              raise SystemExit(
                  f"Missing required GitHub secret(s): {missing}. Add them under "
                  f"repo Settings -> Secrets and variables -> Actions."
              )
          with open("secrets_bridge/secrets.json", "w") as f:
              json.dump(secrets, f)
          with open("secrets_bridge/dataset-metadata.json", "w") as f:
              json.dump({
                  "title": "Kaggle Secrets Bridge",
                  "id": f"{os.environ['KAGGLE_USERNAME']}/kaggle-secrets-bridge",
                  "licenses": [{"name": "unknown"}],
              }, f)
          PYEOF

          echo "Pushing secrets_bridge dataset to Kaggle (private, visible only to this account)..."
          if kaggle datasets version -p secrets_bridge -m "Update from run ${{ github.run_number }}" -q; then
            echo "Updated the existing secrets-bridge dataset."
          else
            echo "No existing secrets-bridge dataset -- creating it for the first time."
            kaggle datasets create -p secrets_bridge -q
          fi
          # Kaggle needs a few seconds to finish processing a just-created/updated dataset before
          # it's attachable to a kernel push -- a short wait here avoids a race against that.
          sleep 15

      # CHANGED: dataset_sources was empty, which is why "No adapter_config.json found anywhere
      # under /kaggle/input" happened -- nothing was ever telling Kaggle to attach the LoRA
      # adapter dataset to this kernel. Both the adapter and the new secrets-bridge dataset are
      # added here (kernel-metadata.json in the repo keeps dataset_sources: [] as a clean
      # baseline; this step fills it in at push time).
      - name: Attach datasets to the kernel
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          python3 - <<'PYEOF'
          import json, os
          path = "kaggle_notebook/kernel-metadata.json"
          with open(path) as f:
              meta = json.load(f)
          wanted = [
              f"{os.environ['KAGGLE_USERNAME']}/kaggle-secrets-bridge",
              "techsir/qwen25-coder-14b-unity-lora-adapter",  # the Unity-tuned LoRA adapter
          ]
          existing = set(meta.get("dataset_sources", []))
          existing.update(wanted)
          meta["dataset_sources"] = sorted(existing)
          with open(path, "w") as f:
              json.dump(meta, f, indent=2)
          print("dataset_sources now:", meta["dataset_sources"])
          PYEOF

      - name: Push Worker Notebook to Kaggle
        run: |
          echo "Pushing notebook to Kaggle..."
          kaggle kernels push -p kaggle_notebook/ --accelerator NvidiaTeslaT4

      - name: Wait for the Kaggle server to be reachable
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
        run: |
          # Wait up to 4 minutes on the unauthenticated /health endpoint
          for i in $(seq 1 1440); do
            if curl -sf "${NGROK_URL}/health" > /dev/null; then
              echo "Server is reachable."
              exit 0
            fi
            echo "[wait $i/1440] Server not reachable yet, retrying in 2s..."
            sleep 2
          done
          echo "Server never became reachable after 4 minutes -- is the notebook running?"
          exit 1

      - name: Find the spec docs zip (any filename containing "Shelf")
        id: findzip
        run: |
          echo "Repo root contents:"
          ls -la
          MATCH=$(find . -maxdepth 1 -iname "*Shelf*.zip" | head -n 1)
          if [ -z "$MATCH" ]; then
            echo "ERROR: no *Shelf*.zip file found at repo root -- see listing above."
            exit 1
          fi
          MATCH="${MATCH#./}"
          echo "Found: $MATCH ($(stat -c%s "$MATCH") bytes)"
          echo "zip_path=$MATCH" >> "$GITHUB_OUTPUT"

      - name: Request generation
        id: request
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          ZIP_PATH: ${{ steps.findzip.outputs.zip_path }}
        run: |
          RESPONSE=$(curl -s -X POST "${NGROK_URL}/generate" \
            -H "Authorization: Bearer ${API_KEY}" \
            -F "docs=@${ZIP_PATH}")
          echo "$RESPONSE"
          JOB_ID=$(echo "$RESPONSE" | jq -r '.job_id')
          if [ "$JOB_ID" == "null" ] || [ -z "$JOB_ID" ]; then
            echo "Failed to start a generation job -- response above."
            exit 1
          fi
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Poll until generation finishes
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          for i in $(seq 1 100); do
            STATUS=$(curl -s "${NGROK_URL}/status/${JOB_ID}" -H "Authorization: Bearer ${API_KEY}")
            STATE=$(echo "$STATUS" | jq -r '.state')
            echo "[poll $i] state=$STATE"
            if [ "$STATE" == "done" ]; then
              exit 0
            elif [ "$STATE" == "error" ]; then
              echo "$STATUS"
              exit 1
            fi
            sleep 60
          done
          echo "Timed out waiting for generation."
          exit 1

      - name: Download and merge into repo
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          curl -s "${NGROK_URL}/result/${JOB_ID}" -H "Authorization: Bearer ${API_KEY}" \
            --output generated_project.zip
          mkdir -p _generated_tmp
          unzip -o generated_project.zip -d _generated_tmp
          for d in Assets Packages ProjectSettings; do
            if [ -d "_generated_tmp/$d" ]; then
              mkdir -p "$d"
              cp -rf "_generated_tmp/$d/." "$d/"
            fi
          done
          rm -rf _generated_tmp generated_project.zip

      - name: Commit and push (PAT -- triggers the compile workflow)
        run: |
          git config user.name "generator-bot"
          git config user.email "generator-bot@users.noreply.github.com"
          git add Assets Packages ProjectSettings
          if ! git diff --cached --quiet; then
            git commit -m "Generate project from spec_docs.zip (run ${{ github.run_number }})"
            git push
          else
            echo "Nothing changed -- generation produced an identical project."
          fi
