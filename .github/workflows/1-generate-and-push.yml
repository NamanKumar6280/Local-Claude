name: 1. Generate Project From Docs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*Shelf*.zip'   # fires whenever you replace or add a file matching *Shelf*.zip

permissions:
  contents: write
  actions: read

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}

      - name: Set up Python for Kaggle API
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Auto-start Kaggle Notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle
          
          # Navigate into the kaggle_notebook folder
          cd kaggle_notebook
          
          echo "Pushing and triggering Kaggle notebook..."
          # Ensure kernel-metadata.json is properly configured inside kaggle_notebook folder
          kaggle kernels push -p kaggle_notebook --accelerator NvidiaTeslaT4
          
          echo "Kaggle notebook triggered successfully. Waiting 7-9 minutes for startup..."
          # Sleep for 8 minutes (480 seconds) to let model load and ngrok establish
          sleep 480

      - name: Wait for the Kaggle server to be reachable
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${NGROK_URL}/health" > /dev/null; then
              echo "Server is reachable."
              exit 0
            fi
            echo "[wait $i/30] Server not reachable yet, retrying in 10s..."
            sleep 10
          done
          echo "Server never became reachable after extended checks -- is ngrok configured properly in the notebook?"
          exit 1

      - name: Find the spec docs zip (any filename containing "Shelf")
        id: findzip
        run: |
          echo "Repo root contents:"
          ls -la
          MATCH=$(find . -maxdepth 1 -iname "*Shelf*.zip" | head -n 1)
          if [ -z "$MATCH" ]; then
            echo "ERROR: no *Shelf*.zip file found at repo root -- see listing above."
            exit 1
          fi
          MATCH="${MATCH#./}"
          echo "Found: $MATCH ($(stat -c%s "$MATCH") bytes)"
          echo "zip_path=$MATCH" >> "$GITHUB_OUTPUT"

      - name: Request generation
        id: request
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          ZIP_PATH: ${{ steps.findzip.outputs.zip_path }}
        run: |
          echo "Sending POST request to ${NGROK_URL}/generate with file ${ZIP_PATH}"
          RESPONSE=$(curl -s -i -L -X POST "${NGROK_URL}/generate" \
            -H "Authorization: Bearer ${API_KEY}" \
            -F "docs=@${ZIP_PATH}")
          
          echo "--- FULL CURL RESPONSE ---"
          echo "$RESPONSE"
          echo "--------------------------"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP/[0-9.]* [0-9]*' | tail -n1 | awk '{print $2}')
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Server returned HTTP status $HTTP_STATUS."
            exit 1
          fi
          
          BODY=$(echo "$RESPONSE" | awk 'BEGIN {RS="\r\n\r\n|\n\n"} END {print}')
          JOB_ID=$(echo "$BODY" | jq -r '.job_id // empty')
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" == "null" ]; then
            echo "Failed to start a generation job -- response body did not contain a job_id."
            exit 1
          fi
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Poll until generation finishes
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          for i in $(seq 1 100); do
            STATUS=$(curl -s "${NGROK_URL}/status/${JOB_ID}" -H "Authorization: Bearer ${API_KEY}")
            STATE=$(echo "$STATUS" | jq -r '.state')
            echo "[poll $i] state=$STATE"
            if [ "$STATE" == "done" ]; then
              exit 0
            elif [ "$STATE" == "error" ]; then
              echo "$STATUS"
              exit 1
            fi
            sleep 60
          done
          echo "Timed out waiting for generation."
          exit 1

      - name: Download and merge into repo
        env:
          NGROK_URL: ${{ secrets.NGROK_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
        run: |
          curl -s "${NGROK_URL}/result/${JOB_ID}" -H "Authorization: Bearer ${API_KEY}" \
            --output generated_project.zip
          mkdir -p _generated_tmp
          unzip -o generated_project.zip -d _generated_tmp
          for d in Assets Packages ProjectSettings; do
            if [ -d "_generated_tmp/$d" ]; then
              mkdir -p "$d"
              cp -rf "_generated_tmp/$d/." "$d/"
            fi
          done
          rm -rf _generated_tmp generated_project.zip

      - name: Commit and push (PAT -- triggers the compile workflow)
        run: |
          git config user.name "generator-bot"
          git config user.email "generator-bot@users.noreply.github.com"
          git add Assets Packages ProjectSettings
          if ! git diff --cached --quiet; then
            git commit -m "Generate project from spec docs (run ${{ github.run_number }})"
            git push
          else
            echo "Nothing changed -- generation produced an identical project."
          fi

      - name: Set up Python for Log Processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Log Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Previous Run Logs & Convert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'EOF'
          import os
          import requests
          import zipfile
          io = __import__('io')

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json"
          }

          runs_url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=2"
          response = requests.get(runs_url, headers=headers)
          response.raise_for_status()
          runs = response.json().get("workflow_runs", [])

          if len(runs) < 2:
              print("No previous workflow run found.")
              exit(0)

          prev_run_id = runs[1]["id"]
          print(f"Targeting previous run ID: {prev_run_id}")

          logs_url = f"https://api.github.com/repos/{repo}/actions/runs/{prev_run_id}/logs"
          logs_response = requests.get(logs_url, headers=headers, allow_redirects=True)
          
          if logs_response.status_code != 200:
              print(f"Failed to fetch logs: {logs_response.status_code}")
              exit(1)

          os.makedirs("extracted_logs", exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(logs_response.content)) as z:
              z.extractall("extracted_logs")
          EOF

      - name: Run log_to_json.py Script
        run: |
          python tools/log_to_json.py extracted_logs --out-dir . --out-name output.json

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-workflow-logs-json
          path: output.json
