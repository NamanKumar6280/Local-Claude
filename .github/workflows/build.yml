name: Build Android APK 🎮

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for Android (APK) 🚀
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Run generator script to produce project files
      - name: Generate Unity Project Files
        run: |
          echo "Executing deepseek generator script..."
          python deepseek_python_20260807_5b0d45.py
          echo "Generation complete. Checking produced files..."
          ls -la

      # 4. Cache Library folder to speed up subsequent builds
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      # 5. Build Android APK
      - name: Build Unity Project (Android APK)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.2f1
          buildName: CousinHorrorGame
          allowDirtyBuild: true

      # 6. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CousinHorrorGame-APK
          path: build/Android/*.apk
