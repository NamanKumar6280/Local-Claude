name: Build Android APK 🎮

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build for Android (APK) 🚀
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Set up Python environment to run the file generator script
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Run your generator script to produce all project files
      - name: Generate Unity Project Files
        run: |
          echo "Executing deepseek generator script..."
          python deepseek_python_20260807_5b0d45.py
          echo "Generation complete. Checking produced files..."
          ls -la

      # 4. Cache Library folder to speed up subsequent builds
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      # 5. Request Unity Activation License (Free Personal Tier)
      - name: Request Unity Activation License
        uses: game-ci/unity-request-activation-file@v3
        id: getLicense
        with:
          unity-version: 2022.3.2f1

      # 6. Activate Unity using GitHub Secrets
      - name: Activate Unity
        uses: game-ci/unity-activate@v3
        with:
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          activation-file: ${{ steps.getLicense.outputs.activation-file }}

      # 7. Build Android APK from the generated files
      - name: Build Unity Project (Android APK)
        uses: game-ci/unity-builder@v3
        with:
          targetPlatform: Android
          androidAppBundle: false
          unityVersion: 2022.3.2f1

      # 8. Upload APK Artifact to GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CousinHorrorGame-APK
          path: build/Android/android.apk
